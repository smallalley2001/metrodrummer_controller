<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Metro Drummer</title>
  <link rel="icon" type="image/png" href="./img/metrodrummer_controller.png">
  <script src="./js/brython.js"></script>
  <script src="./js/brython_stdlib.js"></script>
  <script src="./js/load_brython.js"></script>
  <style>
    :root {
      --bg: #111317;
      --card: #1a1e24;
      --card-active: #1f2b24;
      --border: #2c323d;
      --text: #f1f3f5;
      --muted: #9aa3b2;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px 16px 48px;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 720px;
    }

    header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0 0 6px 0;
      font-size: 1.45rem;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--danger);
      display: inline-block;
    }

    .dot.connected {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .badge-unsaved {
      display: none;
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.15);
      color: var(--warn);
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .badge-unsaved.visible {
      display: inline-block;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: #252b34;
      color: var(--text);
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }

    button:hover:not(:disabled) {
      background: #303743;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .banner {
      display: none;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fca5a5;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }

    .pedal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .pedal-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }

    .pedal-card.pressed {
      background: var(--card-active);
      border-color: var(--success);
      transform: scale(1.01);
    }

    .pedal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .pedal-title {
      font-weight: 600;
      font-size: 1rem;
    }

    .pedal-gpio {
      font-size: 0.78rem;
      color: var(--muted);
    }

    select {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #12151a;
      color: var(--text);
      font-size: 0.93rem;
      margin-bottom: 10px;
    }

    .pedal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .hw-indicator {
      font-size: 0.82rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hw-indicator.active {
      color: var(--success);
      font-weight: 600;
    }

    .test-btn {
      padding: 6px 12px;
      font-size: 0.84rem;
    }

    .actions-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .actions-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .toast {
      margin-top: 12px;
      min-height: 22px;
      font-size: 0.88rem;
      color: var(--muted);
      text-align: right;
    }

    .toast.error { color: #fca5a5; }
    .toast.success { color: #86efac; }
  </style>
</head>
<body>
  <div class="container">
    <div id="browserWarning" class="banner">
      Web Bluetooth is not supported in this browser. Open this page in Chrome, Edge, or Bluefy over HTTPS or localhost.
    </div>

    <header>
      <div>
        <h1>My Metro Drummer</h1>
      </div>
    </header>
    <header>
      <div>
        <h3>MetroDrummer Controller</h3>
        <div class="status-row">
          <span id="statusDot" class="dot"></span>
          <span id="deviceName">Not connected</span>
          <span id="unsavedBadge" class="badge-unsaved">Unsaved changes</span>
        </div>
      </div>
      <div class="actions-group">
        <button id="connectBtn" class="primary">Connect Bluetooth</button>
      </div>
    </header>

    <div id="pedalGrid" class="pedal-grid"></div>

    <div class="actions-bar">
      <button id="defaultsBtn" disabled>Load Defaults</button>
      <div class="actions-group">
        <button id="cancelBtn" disabled>Cancel</button>
        <button id="saveBtn" class="primary" disabled>Save to Pedal</button>
      </div>
    </div>

    <div id="statusToast" class="toast">Ready. Click "Connect Bluetooth" to begin.</div>
  </div>

  <script type="text/python" src="./js/metrodrummer_controller.bry"></script>
</body>
</html>
